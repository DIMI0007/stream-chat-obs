name: Build Stream Chat OBS (Windows)

on:
  push:
    branches: [main, "codex/release-final", "codex/youtube-chat-fallback"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure OBS 33 and plugin
        run: cmake --preset windows-ci-x64
      - name: Build Windows x64 DLL
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Test protected storage, OAuth and chat wire formats
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Stage plugin package
        shell: pwsh
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path package/stream-chat-obs/bin/64bit/stream-chat-obs.dll)) { throw 'Plugin DLL missing' }
          if (!(Test-Path package/stream-chat-obs/bin/64bit/Qt6WebSockets.dll)) { throw 'WebSocket runtime missing' }
          if (!(Test-Path package/stream-chat-obs/data/qt-plugins/tls/qschannelbackend.dll)) { throw 'TLS backend missing' }
          $runtime = 'vendor/Qt6WebSockets.dll'
          if ((Get-FileHash $runtime -Algorithm SHA256).Hash -ne 'A158B90C70D8B6DD3C651028A7C3D93BD751440598F551CD763FED78E31D8008') { throw 'Pinned WebSocket runtime hash mismatch' }
          Copy-Item $runtime package/stream-chat-obs/bin/64bit/Qt6WebSockets.dll -Force
          $bin = 'package/stream-chat-obs/bin/64bit'
          foreach ($file in Get-ChildItem $bin -File) { Move-Item -LiteralPath $file.FullName -Destination 'package/stream-chat-obs' -Force }
          Remove-Item $bin
          Remove-Item 'package/stream-chat-obs/bin'
          if (!(Test-Path package/stream-chat-obs/stream-chat-obs.dll)) { throw 'OBS 33 plugin layout missing' }
          if (Test-Path package/stream-chat-obs/bin) { throw 'Legacy plugin layout remains' }
          Copy-Item docs/INSTALL_RU.md package/INSTALL_RU.md
          Copy-Item docs/REGISTER_APPS_RU.md package/REGISTER_APPS_RU.md
          Copy-Item docs/KICK_RU.md package/KICK_RU.md
          $spec=Get-Content buildspec.json -Raw|ConvertFrom-Json
          [ordered]@{product='Stream Chat OBS';version=$spec.version;commit=$env:GITHUB_SHA;obs='33.0.0';qt='6.11.1';packageType='unsigned-alpha';platforms=@('Twitch','YouTube','Kick');liveAccountValidation='pending'}|ConvertTo-Json|Set-Content package/BUILD_INFO.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: StreamChatOBS-OBS33-Windows-x64
          path: package/
          if-no-files-found: error
      - name: Render Russian and English dock previews
        shell: pwsh
        run: |
          $qtRoot = Join-Path $PWD ".deps/obs-deps-qt6-2026-10-23-x64"
          $env:PATH = "$qtRoot/bin;$PWD/build_x64/qtwebsockets-install/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot/plugins"
          & ./build_x64/RelWithDebInfo/stream-chat-ui-preview.exe ui-previews
          Write-Output "UI preview process exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StreamChat-UI-Previews
          path: ui-previews/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StreamChat-Kick-Check
          path: |
            build_x64/RelWithDebInfo/stream-chat-kick-live-check.exe
            build_x64/RelWithDebInfo/stream-chat-ui-preview.exe
          if-no-files-found: error
