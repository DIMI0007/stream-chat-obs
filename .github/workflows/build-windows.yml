name: Build Stream Chat OBS (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure OBS 33 and plugin
        run: cmake --preset windows-ci-x64
      - name: Build Windows x64 DLL
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Test protected storage, OAuth and YouTube stream framing
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Stage plugin package
        shell: pwsh
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path package/stream-chat-obs/bin/64bit/stream-chat-obs.dll)) { throw 'Plugin DLL missing' }
          if (!(Test-Path package/stream-chat-obs/bin/64bit/Qt6WebSockets.dll)) { throw 'WebSocket runtime missing' }
          if (!(Test-Path package/stream-chat-obs/data/qt-plugins/tls/qschannelbackend.dll)) { throw 'TLS backend missing' }
          $spec=Get-Content buildspec.json -Raw|ConvertFrom-Json
          [ordered]@{product='Stream Chat OBS';version=$spec.version;commit=$env:GITHUB_SHA;obs='33.0.0';qt='6.11.1';packageType='unsigned-alpha';platforms=@('Twitch','YouTube');liveAccountValidation='pending'}|ConvertTo-Json|Set-Content package/BUILD_INFO.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: StreamChatOBS-OBS33-Windows-x64
          path: package/
          if-no-files-found: error

